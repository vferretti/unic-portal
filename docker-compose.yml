services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unic-api
    ports:
      - "8081:8080"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: vincent
      PGPASSWORD: vincent
      PGDATABASE: unic_db
      PGSSLMODE: disable
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
    networks:
      - initdb-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unic-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - initdb-net

networks:
  initdb-net:
    external: true
