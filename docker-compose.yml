services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unic-api
    ports:
      - "8081:8080"
    environment:
      OPENSEARCH_HOST: ${OPENSEARCH_HOST:-host.docker.internal}
      OPENSEARCH_PORT: ${OPENSEARCH_PORT:-9200}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unic-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
